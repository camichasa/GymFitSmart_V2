<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../assets/css/estilos_autenticacion.css">

    <title>Registro - GymFit Smart</title>
</head>

<body>

    <main class="contenedor">

        <section class="tarjeta">

            <h1 class="logo-texto">GYMFIT SMART</h1>

            <h2>Crear cuenta</h2>

            <p class="subtitulo">
                Registrate para comenzar
            </p>

            <form action="registrar_usuario.php" method="post">

                <section class="campo">
                    <label for="nombre">Nombre</label>

                    <input type="text" name="nombre" id="nombre" placeholder="Ingresá tu nombre" required>
                </section>

                <section class="campo">
                    <label for="email">Email</label>

                    <input type="email" name="email" id="email" placeholder="Ingresá tu email" required>
                </section>

                <section class="campo">
                    <label for="contra">Contraseña</label>

                    <input type="password" name="contra" id="contra" placeholder="Ingresá tu contraseña" required>
                </section>

                <section class="campo">
                    <label for="rol">Rol</label>

                    <select name="rol" id="rol" required>
                        <option value="entrenador">Entrenador</option>
                        <option value="alumno">Alumno</option>
                    </select>
                </section>

                <button type="submit" class="btn-principal">
                    REGISTRARSE
                </button>

            </form>

            <p class="pie-formulario">
                ¿Ya tenés cuenta?
                <a href="iniciar_sesion.html">Ingresar</a>
            </p>

        </section>

    </main>

</body>

</html>
